name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bun
        run: scripts/ci/install-bun.sh
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
        env:
          # The ten tests that need an address on the local network fail instead of skipping.
          AIDM_REQUIRE_LAN_TESTS: "1"

  build:
    name: Build the four executables
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bun
        run: scripts/ci/install-bun.sh
      - run: bun install --frozen-lockfile
      - name: Cross-compile Linux x64, Linux arm64, macOS arm64 and Windows x64
        run: bun scripts/build.ts --development
      - name: Smoke test the Linux x64 executable
        run: scripts/ci/smoke-test.sh dist/aidm-ui-linux-x64
      # One artifact per platform, named after it, so a tester downloads one executable.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aidm-ui-linux-x64
          path: dist/aidm-ui-linux-x64
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aidm-ui-linux-arm64
          path: dist/aidm-ui-linux-arm64
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aidm-ui-macos-arm64
          path: dist/aidm-ui-macos-arm64
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aidm-ui-windows-x64
          path: dist/aidm-ui-windows-x64.exe
          if-no-files-found: error
          retention-days: 7

  real-runtimes:
    name: Real Podman and Docker with a tiny image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bun
        run: scripts/ci/install-bun.sh
      - run: bun install --frozen-lockfile
      - run: podman --version && docker --version
      - run: bun test ./server/runtimes/real-runtimes.test.ts
        env:
          AIDM_REAL_RUNTIMES: podman,docker

  # The version below is the aidm-api 2.7.0 release whose Linux x64 archive
  # the test downloads and starts in test mode. It bundles neither unzip
  # nor 7z; the test mode run needs neither, and the runners have both.
  real-task-api:
    name: Real task API in test mode through the native package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bun
        run: scripts/ci/install-bun.sh
      - run: bun install --frozen-lockfile
      - run: bun test ./server/packages/real-task-api.test.ts
        env:
          AIDM_REAL_TASK_API_VERSION: "2.7.0"

  real-task-api-windows:
    name: Real task API on Windows through the native package
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Match scripts/ci/install-bun.sh, with the Windows archive's published SHA-256.
      - name: Install Bun
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bunVersion = "1.4.4"
          $asset = "bun-windows-x64"
          $sha256 = "cd2c0fccc78f3ede1f50ca827a15f063eda13d4d150a3d0674f4f6e323d864a5"
          $installDir = Join-Path $env:RUNNER_TEMP "bun-$bunVersion"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          $archive = Join-Path $installDir "bun.zip"
          Invoke-WebRequest -Uri "https://github.com/oven-sh/bun/releases/download/bun-v$bunVersion/$asset.zip" -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant() -ne $sha256) {
            throw "Bun archive SHA-256 does not match the published checksum."
          }
          Expand-Archive -Path $archive -DestinationPath $installDir -Force
          $bunDir = Join-Path $installDir $asset
          $bunDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $bunDir "bun.exe") --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: bun install --frozen-lockfile
      - name: Install, run, reattach and stop the real task API
        run: bun test ./server/packages/real-task-api.test.ts
        env:
          AIDM_REAL_TASK_API_VERSION: "2.7.0"
