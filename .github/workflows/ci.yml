name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bun
        run: scripts/ci/install-bun.sh
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
        env:
          # The ten tests that need an address on the local network fail instead of skipping.
          AIDM_REQUIRE_LAN_TESTS: "1"

  build:
    name: Build the four executables
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bun
        run: scripts/ci/install-bun.sh
      - run: bun install --frozen-lockfile
      - name: Cross-compile Linux x64, Linux arm64, macOS arm64 and Windows x64
        run: bun scripts/build.ts --development
      - name: Smoke test the Linux x64 executable
        run: scripts/ci/smoke-test.sh dist/aidm-ui-linux-x64
      # One artifact per platform, named after it, so a tester downloads one executable.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aidm-ui-linux-x64
          path: dist/aidm-ui-linux-x64
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aidm-ui-linux-arm64
          path: dist/aidm-ui-linux-arm64
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aidm-ui-macos-arm64
          path: dist/aidm-ui-macos-arm64
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aidm-ui-windows-x64
          path: dist/aidm-ui-windows-x64.exe
          if-no-files-found: error
          retention-days: 7

  real-runtimes:
    name: Real Podman and Docker with a tiny image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bun
        run: scripts/ci/install-bun.sh
      - run: bun install --frozen-lockfile
      - run: podman --version && docker --version
      - run: bun test ./server/runtimes/real-runtimes.test.ts
        env:
          AIDM_REAL_RUNTIMES: podman,docker

  # The version below is the aidm-api release whose Linux x64 archive the test
  # downloads and starts in test mode. 2.6.1 is the first with that archive
  # (there is no 2.6.0 release). It bundles neither unzip nor 7z; the test
  # mode run needs neither, and the runners have both.
  real-task-api:
    name: Real task API in test mode through the native package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bun
        run: scripts/ci/install-bun.sh
      - run: bun install --frozen-lockfile
      - run: bun test ./server/packages/real-task-api.test.ts
        env:
          AIDM_REAL_TASK_API_VERSION: "2.6.1"
