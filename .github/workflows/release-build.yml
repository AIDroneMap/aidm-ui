name: Release build

# Builds the four executables the way a release is built: without the
# --development flag, so the build stops while a test key is still accepted.
# It publishes nothing and creates no tag; it only uploads the executables as
# an artifact of the run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    name: Build the four executables for a release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bun
        run: scripts/ci/install-bun.sh
      - run: bun install --frozen-lockfile
      - name: Cross-compile Linux x64, Linux arm64, macOS arm64 and Windows x64
        run: bun scripts/build.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aidm-ui-release-executables
          path: dist/
          if-no-files-found: error
          retention-days: 7
