name: Release build

# Builds the four executables the way a release is built: without the
# --development flag, so the build stops while a test key is still accepted.
# It publishes nothing and creates no tag; it uploads each executable as an
# artifact of its own, with a table of their sizes for the release notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    name: Build the four executables for a release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bun
        run: scripts/ci/install-bun.sh
      - run: bun install --frozen-lockfile
      - name: Cross-compile Linux x64, Linux arm64, macOS arm64 and Windows x64
        run: bun scripts/build.ts
      # The workflow publishes no release. The size table goes into the run's
      # summary and into a file, for the release notes the maintainer writes.
      - name: Write the size of each executable for the release notes
        run: |
          mkdir notes
          bun scripts/executable-sizes.ts dist > notes/release-notes-sizes.md
          cat notes/release-notes-sizes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aidm-ui-release-notes-sizes
          path: notes/release-notes-sizes.md
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aidm-ui-linux-x64
          path: dist/aidm-ui-linux-x64
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aidm-ui-linux-arm64
          path: dist/aidm-ui-linux-arm64
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aidm-ui-macos-arm64
          path: dist/aidm-ui-macos-arm64
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aidm-ui-windows-x64
          path: dist/aidm-ui-windows-x64.exe
          if-no-files-found: error
          retention-days: 7
